services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sincey
      POSTGRES_PASSWORD: sincey_local
      POSTGRES_DB: sincey
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - sincey-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sincey']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  sincey-db:
